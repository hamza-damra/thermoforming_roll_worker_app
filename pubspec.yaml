name: thermoforming_roll_worker
description: "Taleeb Thermoforming Roll Worker App (تطبيق عامل الرولات)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5

  go_router: ^14.6.2

  mobile_scanner: ^5.2.3

  intl: ^0.20.2

  # Printing subsystem (TSPL/socket pipeline adapted from roll_production_app).
  qr: ^3.0.1
  image: ^4.1.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  hive_generator: ^2.0.1

  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
